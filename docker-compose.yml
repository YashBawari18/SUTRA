version: "3.8"

services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: sutra-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/sutra-dev-password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: sutra-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sutra-dev-password
      - POSTGRES_DB=sutra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service (Optional containerized execution)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sutra-backend
    ports:
      - "8000:8000"
    environment:
      - SUTRA_JWT_SECRET=sutra-development-insecure-secret-key-32chars
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=sutra-dev-password
      - POSTGRES_URL=postgresql://postgres:sutra-dev-password@postgres:5432/sutra
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
